- type: entity
  id: BaseVehicle
  save: false
  abstract: true
  suffix: Vehicle
  components:
  - type: TriggerOnInsertedIntoContainer
    keyOut: Insert
  - type: TriggerOnRemovedFromContainer
    keyOut: Removed
  - type: AddComponentsOnTrigger
    removeExisting: true
    targetUser: false
    keysIn:
    - Insert
    components:
    - type: MobState
    - type: NpcFactionMember
      factions:
        - Xenoborg
  - type: RemoveComponentsOnTrigger
    targetUser: false
    keysIn:
    - Removed
    components:
    - type: MobState
    - type: NpcFactionMember
      factions:
        - Xenoborg
  - type: MobMover
  - type: Mech
    integrity: 100000
    maxIntegrity: 100000
    baseState: icon
    openState: icon
    brokenState: icon
    airtight: false
    batteryRemovalDelay: 10
  - type: Vehicle
    canAttack: true
    transferDamage: false
    operatorWhitelist:
      tags:
        - CanPilot
  - type: ContainerVehicle
    containerId: "mech-pilot-slot"
  - type: MechAir
  - type: AirFilter
    gases:
    - CarbonDioxide
    - Plasma
    - Tritium
    - WaterVapor
    - Ammonia
    - NitrousOxide
    - Frezon
    overflowGases:
    - Nitrogen
    - CarbonDioxide
    - Plasma
    - Tritium
    - WaterVapor
    - Ammonia
    - NitrousOxide
    - Frezon
  - type: AirIntake
  - type: AtmosDevice
    requireAnchored: false
    joinSystem: true
  - type: DoAfter
  - type: Repairable
    fuelCost: 25
    doAfterDelay: 10
  - type: UserInterface
    interfaces:
      enum.MechUiKey.Key:
        type: MechBoundUserInterface
  - type: InputMover
  - type: InteractionOutline
  - type: MovementSpeedModifier
    baseWalkSpeed: 1
    baseSprintSpeed: 2
  - type: Tag
    tags:
    - DoorBumpOpener
  - type: Pullable
  - type: Physics
    bodyType: KinematicController
  - type: GravityAffected
  - type: Clickable
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.45
        density: 1000
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Appearance
  - type: ContainerContainer
    containers:
      mech-pilot-slot: !type:ContainerSlot
      mech-equipment-container: !type:Container
      mech-battery-slot: !type:ContainerSlot
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: Inorganic
  - type: MovementSound
    sound:
      path: /Audio/_Grosse/Machines/hummer_vehicle_drive_mono.ogg
      params:
        loop: True
  - type: UnpoweredFlashlight
  - type: PointLight
    enabled: false
    mask: /Textures/Effects/LightMasks/cone.png
    autoRot: true
    radius: 16
    energy: 4
    netsync: true
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 400
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: ["Destruction"]

- type: entity
  id: VehicleMoskvich17
  parent: BaseGrosseCar
  name: модифицированный довоенный автомобиль
  description: Модифицированная Альянсом авто для использование его в сложных условиях.
  components:
  - type: GrosseCar
    engineForce: 35000
    brakeForce: 70000
    handbrakeForce: 45000
    maxForwardSpeed: 8
    maxReverseSpeed: 3
    steerRate: 2.8
    maxDriveDamage: 100
    occupantDamageMultiplier: 0.75
    slots:
    - id: driver
      name: grosse-car-slot-driver
      containerId: car-driver
      isDriver: true
      visuals: Driver
    - id: passenger
      name: grosse-car-slot-passenger
      containerId: car-passenger
      visuals: Passenger1
  - type: Sprite
    sprite: _Grosse/rsi/Structures/Decoration/Transport/moskvich.rsi
    scale: 0.8, 0.8
    layers:
    - state: m1-rotating
      map: [ "enum.GrosseCarVisualLayers.Base" ]
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          # South frame at 0.8 scale, including the bumpers.
          bounds: "-0.65,-1.4,0.7,1.0"
        density: 250 # Approximately 810 kg.
        restitution: 0
        hard: true
        mask:
        - MobMask
        - BulletImpassable
        layer:
        - MachineLayer
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:EmptyContainersBehaviour
        containers:
        - car-driver
        - car-passenger
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Storage
    grid:
    - 0,0,5,5
    maxItemSize: Normal
    storageOpenSound: /Audio/Effects/closetopen.ogg
    storageCloseSound: /Audio/Effects/closetclose.ogg
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface

- type: entity
  id: VehicleZIL17
  parent: BaseGrosseCar
  name: грузовик
  description: Довоенный тяжелый транспорт для транспортировки множества вещей.
  components:
  - type: GrosseCar
    engineForce: 65000
    brakeForce: 100000
    handbrakeForce: 80000
    maxForwardSpeed: 6
    maxReverseSpeed: 2.5
    steerRate: 2
    maxDriveDamage: 150
    occupantDamageMultiplier: 0.2
  - type: Sprite
    sprite: _Grosse/Structures/Decoration/Vehicles/zil.rsi
    scale: 1.1, 1.1
    layers:
    - state: z2-rotating
      map: [ "enum.GrosseCarVisualLayers.Base" ]
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          # South frame at 1.1 scale; the artwork is offset to the right.
          bounds: "-0.5,-2.45,1.25,2.2"
        density: 200 # Approximately 1628 kg.
        restitution: 0
        hard: true
        mask:
        - MobMask
        - BulletImpassable
        layer:
        - MachineLayer
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:EmptyContainersBehaviour
        containers:
        - car-driver
        - car-passenger
        - car-passenger2
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Storage
    grid:
    - 0,0,11,11
    maxItemSize: Ginormous
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface

- type: entity
  id: MoskvichLayer
  name: передняя пассажирская дверь
  parent: BaseStructure
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Grosse/rsi/Structures/Decoration/Transport/moskvich.rsi
    drawdepth: Doors
    scale: 0.8, 0.8
    noRot: true
    layers:
    - state: copilotdoor
  - type: InteractionOutline
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:EmptyContainersBehaviour
        containers:
        - scanner-body
  - type: DragInsertContainer
    containerId: scanner-body
    entryDelay: 2
  - type: ExitContainerOnMove
    containerId: scanner-body
  - type: ContainerContainer
    containers:
      scanner-body: !type:Container
